name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/**'

# Cancel a superseded run when a new commit lands on the same branch/PR, so
# iterative pushes (Codex fix rounds, recovery commits) don't leave stale runs
# burning to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, non-test gates. Run once (not per shard) so they don't multiply.
  # Runs on PRs and on push to main (cheap belt-and-suspenders on the merge).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.9.2"
      - run: uv sync --locked
      - run: uv run issueforge lint boundary
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run issueforge audit check S2

  # The pytest suite is dominated by real-venv provisioning tests (15-38s each),
  # so on a 2-core ubuntu-latest runner it takes ~14 min. Shard it across parallel
  # jobs (pytest-split, balanced by the committed .test_durations) so total wall
  # clock drops to ~one shard (~4 min). fail-fast off so every shard reports.
  #
  # PRs only: the full suite must be green to merge, so re-running it on push to
  # main is redundant. main stays protected by the required PR run + the checks
  # job above.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.9.2"
      - run: uv sync --locked
      - run: uv run pytest -n auto --dist worksteal --splits 4 --group ${{ matrix.group }}
