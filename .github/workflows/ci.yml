name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast, non-test gates. Run once (not per shard) so they don't multiply.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.9.2"
      - run: uv sync --locked
      - run: uv run issueforge lint boundary
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run issueforge audit check S2

  # The pytest suite is dominated by real-venv provisioning tests (15-38s each),
  # so on a 2-core ubuntu-latest runner it takes ~14 min. Shard it across parallel
  # jobs (pytest-split, balanced by the committed .test_durations) so total wall
  # clock drops to ~one shard (~4 min). fail-fast off so every shard reports.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.9.2"
      - run: uv sync --locked
      - run: uv run pytest -n auto --splits 4 --group ${{ matrix.group }}
