[project]
name = "issueforge"
version = "0.1.0"
description = "Human-gated TDD orchestration for GitHub issues"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.86",
  "typer>=0.15",
  "pytest-reportlog>=0.4",
]

[project.scripts]
issueforge = "issueforge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-split>=0.11.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The observability suites are PARKED pending integration, not abandoned (#146):
# src/issueforge/observability.py has no runtime importer yet, so its ~66s of tests prove
# nothing about shipped behavior. The code stays; only its test cost is paused. Run them on
# demand with `make test-parked`. This exclusion MUST be removed in the same PR that wires
# observability into the runtime.
addopts = "--ignore=tests/test_observability.py --ignore=tests/test_observability_unit.py"

[tool.ruff]
line-length = 100
target-version = "py312"
