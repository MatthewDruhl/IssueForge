[project]
name = "issueforge"
version = "0.1.0"
description = "Human-gated TDD orchestration for GitHub issues"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.86",
  "typer>=0.15",
]

[project.scripts]
issueforge = "issueforge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
